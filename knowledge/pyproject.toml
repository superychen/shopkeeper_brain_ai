[project]
name = "shopkeeper-brain-ai"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "grandalf",
    "langchain-openai",
    "langgraph",
    # Windows 使用 pipeline 执行本地 PDF 解析，避免引入 all extra 的完整 GPU 推理栈。
    "mineru[pipeline]; sys_platform == 'win32'",
    "mineru[all]; sys_platform != 'win32'",
    "minio",
    "openai-agents",
    "pymilvus",
    "pymongo",
    "pymupdf>=1.28.2",
    "sentence-transformers",
]

[tool.uv]
# 当前开发环境是 Windows x64；限制解析范围可排除 MinerU 的 Linux vLLM/CUDA 分支。
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
